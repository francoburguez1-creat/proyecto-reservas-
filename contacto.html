<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

    <title>Contacto - SportTech</title>

    <style>

        body {
            margin: 0;
            background-color: #303030;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            min-height: 62px;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 23px;
            color: #00C853 !important;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 500;
            margin-left: 10px;
        }

        .navbar-nav .nav-link:hover {
            color: #00C853 !important;
        }

        .contenido {
            padding: 55px 20px;
        }

        h1 {
            color: #00C853;
            text-align: center;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .contacto {
            max-width: 700px;
            margin: auto;
            background-color: #222222;
            border: 1px solid #00C853;
            border-radius: 12px;
            padding: 35px;
        }

        .dato {
            padding: 20px 0;
            border-bottom: 1px solid #444444;
        }

        .dato:last-child {
            border-bottom: none;
        }

        .dato h3 {
            color: #00C853;
            margin-bottom: 8px;
        }

        .dato p {
            color: #dddddd;
            font-size: 17px;
            margin: 4px 0;
        }

        .volver {
            text-align: center;
            margin-top: 30px;
        }

        .btn-volver {
            background-color: #00C853;
            color: #111111;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-volver:hover {
            background-color: #009624;
            color: white;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <!-- BARRA DE NAVEGACIÓN -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <a class="navbar-brand" href="index.html">
            SportTech
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reservas.html">
                        Mis reservas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="canchas.html">
                        Canchas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="precios.html">
                        Precios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- CONTENIDO -->

    <div class="contenido">

        <div class="container">

            <h1>
                Contacto
            </h1>


            <div class="contacto">

                <div class="dato">

                    <h3>
                        Ubicación
                    </h3>

                    <p>
                        La Paz, Canelones, Uruguay
                    </p>

                </div>


                <div class="dato">

                    <h3>
                        Teléfono
                    </h3>

                    <p>
                        099 000 000
                    </p>

                </div>


                <div class="dato">

                    <h3>
                        Email
                    </h3>

                    <p>
                        sporttech@gmail.com
                    </p>

                </div>


                <div class="dato">

                    <h3>
                        Horarios
                    </h3>

                    <p>
                        Lunes a domingo
                    </p>

                    <p>
                        17:00 a 00:00
                    </p>

                </div>

            </div>


            <div class="volver">

                <a
                    href="index.html"
                    class="btn-volver">

                    Volver al inicio

                </a>

            </div>

        </div>

    </div>


</body>

</html>
